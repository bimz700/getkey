<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MZMODZ — Admin</title><link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="wrap">
<section id="loginCard" class="card">
  <div class="brand">MZ<span>MODZ</span></div><p class="subtitle">ADMIN PANEL</p>
  <input id="email" type="email" placeholder="Admin email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">LOGIN</button><p id="loginStatus" class="status"></p>
</section>
<section id="panel" class="card hidden">
  <div class="topbar"><div><div class="brand small">MZ<span>MODZ</span></div><div id="adminEmail" class="muted"></div></div><button id="logoutBtn" class="danger smallBtn">LOGOUT</button></div>
  <div class="generate">
    <input id="count" type="number" min="1" max="100" value="1" aria-label="Jumlah key">
    <select id="maxDevices" aria-label="Batas device per key">
      <option value="0">UNLIMITED DEVICES</option>
      <option value="1">1 DEVICE</option>
      <option value="5">5 DEVICES</option>
      <option value="10">10 DEVICES</option>
      <option value="25">25 DEVICES</option>
      <option value="50">50 DEVICES</option>
      <option value="100">100 DEVICES</option>
      <option value="500">500 DEVICES</option>
    </select>
    <button id="generateBtn">GENERATE KEY</button>
  </div>
  <p id="panelStatus" class="status"></p>
  <div class="tableWrap"><table><thead><tr><th>KEY</th><th>STATUS</th><th>DEVICES</th><th>CLAIMS</th><th>ACTION</th></tr></thead><tbody id="keyTable"></tbody></table></div>
</section></main>
<script type="module" src="admin.js"></script>
</body></html>
