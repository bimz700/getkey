<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MZMODZ — Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><section id="loginCard" class="card"><div class="brand">MZ<span>MODZ</span></div><p class="subtitle">ADMIN PANEL</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">LOGIN</button><p id="loginStatus" class="status"></p></section><section id="panel" class="card hidden"><div class="topbar"><div><div class="brand small">MZ<span>MODZ</span></div><div id="adminEmail" class="muted"></div></div><button id="logoutBtn" class="danger smallBtn">LOGOUT</button></div>
<h3>KEY ACCESS</h3><div class="generate"><input id="keyInput" placeholder="Masukkan key sendiri"><select id="maxDevices"><option value="0">UNLIMITED DEVICES</option><option value="1">1 DEVICE</option><option value="2">2 DEVICES</option><option value="5">5 DEVICES</option><option value="10">10 DEVICES</option><option value="25">25 DEVICES</option><option value="50">50 DEVICES</option><option value="100">100 DEVICES</option><option value="500">500 DEVICES</option></select><select id="keyStatusSelect"><option value="active">ACTIVE</option><option value="disabled">DISABLED</option></select><button id="saveKeyBtn">SAVE KEY</button></div><p id="keyStatus" class="status"></p>
<h3>SYSTEM CONTROL</h3><div class="systemGrid"><label><input id="maintenance" type="checkbox"> MAINTENANCE</label><label><input id="updateMode" type="checkbox"> UPDATE MODE</label><input id="maintenanceMessage" placeholder="Pesan maintenance"><input id="updateMessage" placeholder="Pesan update"><input id="version" placeholder="Versi, contoh: 2.1"><input id="downloadUrl" placeholder="Link update APK (opsional)"></div><button id="saveSystemBtn">SAVE SYSTEM SETTINGS</button>
<p id="panelStatus" class="status"></p><div class="tableWrap"><table><thead><tr><th>KEY</th><th>STATUS</th><th>DEVICES</th><th>CREATED</th><th>ACTION</th></tr></thead><tbody id="keyTable"></tbody></table></div></section></main><script type="module" src="admin.js"></script></body></html>
