<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GET KEY MZMODZ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-overlay"></div>
  
  <div class="container">
    <div class="card">
      <div class="header">
        <h1 class="brand-title">MZMODZ</h1>
        <p class="subtitle">VIP ACCESS KEY GENERATOR</p>
      </div>

      <div class="status-badge" id="statusBadge">
        <span class="dot"></span> <span id="statusText">System Ready</span>
      </div>

      <div class="instruction" id="instructionText">
        Klik tombol di bawah ini untuk mendapatkan lisensi key Anda. Key berlaku selama 24 jam.
      </div>

      <!-- Button GET KEY -->
      <button id="getKeyBtn" class="btn-primary">
        <span class="btn-text">GET KEY</span>
        <span class="spinner hidden"></span>
      </button>

      <!-- Status Message & Countdown Display -->
      <div id="statusMessage" class="status-msg hidden"></div>
      
      <div id="countdownBox" class="countdown-box hidden">
        <label>COOLDOWN REMAINING:</label>
        <div id="countdownTimer" class="timer-display">24:00:00</div>
      </div>

      <!-- Result Key Display -->
      <div id="resultBox" class="result-box hidden">
        <label>YOUR VIP KEY:</label>
        <div class="key-display-wrapper">
          <input type="text" id="keyInput" readonly value="">
          <button id="copyBtn" class="btn-copy">COPY</button>
        </div>
      </div>

      <div id="toast" class="toast hidden"></div>

      <div class="footer">
        &copy; 2026 MZMODZ Official. All rights reserved.
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
