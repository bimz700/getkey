<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GET KEY MZMODZ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-overlay"></div>
  
  <div class="container">
    <div class="card">
      <div class="header">
        <h1 class="brand-title">MZMODZ</h1>
        <p class="subtitle">VIP ACCESS KEY GENERATOR</p>
      </div>

      <div class="status-badge">
        <span class="dot"></span> Server Online
      </div>

      <div class="instruction">
        Klik tombol di bawah ini untuk mendapatkan lisensi key Anda. Key berlaku selama 24 jam.
      </div>

      <button id="getKeyBtn" class="btn-primary">
        <span class="btn-text">DAPATKAN KEY</span>
        <span class="spinner hidden"></span>
      </button>

      <div id="resultBox" class="result-box hidden">
        <label>KEY ANDA:</label>
        <div class="key-display-wrapper">
          <input type="text" id="keyInput" readonly value="">
          <button id="copyBtn" class="btn-copy">Copy</button>
        </div>
        <div class="timer-info">Masa berlaku: <span id="expiryText">24 Jam</span></div>
      </div>

      <div id="toast" class="toast hidden">Key berhasil disalin ke clipboard!</div>

      <div class="footer">
        &copy; 2026 MZMODZ Official. All rights reserved.
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
